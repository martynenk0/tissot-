<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070b09">
<title>Tissot Le Locle · Powermatic 80 — 360°</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#070b09;color:#e9efe8;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.2s ease}
  #scene.ready{opacity:1}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(120% 95% at 50% 42%,rgba(0,0,0,0) 42%,rgba(0,0,0,.32) 72%,rgba(0,0,0,.72) 100%)}
  .ui{position:fixed;inset:0;z-index:5;pointer-events:none}
  .ui-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;
    padding:34px 40px}
  .brand-name{font-size:17px;letter-spacing:.52em;font-weight:500;line-height:1;color:#f2f6f0;text-indent:.52em}
  .brand-sub{margin-top:9px;font-size:8.5px;letter-spacing:.34em;color:rgba(214,228,214,.5);text-transform:uppercase}
  .reset{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(214,232,214,.18);
    background:rgba(10,18,13,.35);backdrop-filter:blur(6px);cursor:pointer;display:grid;place-items:center;
    transition:border-color .3s,background .3s,transform .3s}
  .reset:hover{border-color:rgba(214,232,214,.45);background:rgba(20,40,28,.5);transform:rotate(-25deg)}
  .reset svg{width:16px;height:16px;stroke:rgba(230,240,230,.8);fill:none;stroke-width:1.4}
  .ui-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;
    padding:34px 40px;gap:20px}
  .specs{display:flex;align-items:center;gap:14px;font-size:9px;letter-spacing:.26em;color:rgba(214,228,214,.48);
    text-transform:uppercase;white-space:nowrap}
  .specs i{display:block;width:3px;height:3px;border-radius:50%;background:rgba(120,180,140,.55)}
  .hint{font-size:9px;letter-spacing:.22em;color:rgba(214,228,214,.34);text-transform:uppercase;text-align:right;
    white-space:nowrap;transition:opacity .8s ease}
  .hint.hide{opacity:0}
  .loader{position:fixed;inset:0;z-index:20;background:#070b09;display:grid;place-items:center;
    transition:opacity .9s ease,visibility .9s}
  .loader.done{opacity:0;visibility:hidden}
  .loader-inner{text-align:center}
  .loader-brand{font-size:22px;letter-spacing:.5em;text-indent:.5em;font-weight:500;color:#eef3ec}
  .loader-cap{margin-top:14px;font-size:8px;letter-spacing:.4em;color:rgba(214,228,214,.35)}
  .loader-line{margin:20px auto 0;width:150px;height:1px;background:rgba(214,228,214,.12);overflow:hidden}
  .loader-line span{display:block;height:100%;width:35%;background:#8fbf9c;animation:slide 1.15s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
  .fallback{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:#070b09;padding:32px;text-align:center}
  .fallback.show{display:grid}
  .fallback p{max-width:420px;font-size:13px;line-height:1.7;color:rgba(232,240,232,.7);letter-spacing:.04em}
  @media (max-width:680px){
    .ui-top{padding:22px 20px}.ui-bottom{padding:20px 20px;flex-direction:column;align-items:flex-start;gap:12px}
    .hint{text-align:left;font-size:8px}.specs{font-size:8px;gap:10px;flex-wrap:wrap;white-space:normal}
    .brand-name{font-size:14px}.brand-sub{font-size:7.5px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header class="ui ui-top">
  <div class="brand">
    <div class="brand-name">TISSOT</div>
    <div class="brand-sub">Le Locle · 1853</div>
  </div>
  <button class="reset" id="reset" aria-label="Сбросить камеру" title="Сбросить камеру">
    <svg viewBox="0 0 24 24"><path d="M20 11.5A8 8 0 1 1 17.6 6"/><path d="M20 3.5v5h-5"/></svg>
  </button>
</header>

<footer class="ui ui-bottom">
  <div class="specs">
    <span>Powermatic 80</span><i></i><span>39.3 mm</span><i></i><span>Sapphire</span><i></i><span>Steel</span>
  </div>
  <div class="hint" id="hint">Потяните, чтобы вращать · Колёсико — масштаб</div>
</footer>

<div class="vignette"></div>

<div class="loader" id="loader">
  <div class="loader-inner">
    <div class="loader-brand">TISSOT</div>
    <div class="loader-line"><span></span></div>
    <div class="loader-cap">LE LOCLE · POWERMATIC 80</div>
  </div>
</div>

<div class="fallback" id="fallback"><p>Для 3D-презентации нужен браузер с поддержкой WebGL 2. Обновите браузер или включите аппаратное ускорение.</p></div>

<script>/*__THREE__*/</script>
<script>/*__DIAL__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
